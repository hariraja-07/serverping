# Builds the image and publishes it to GHCR, and — on a release — attaches the compose file
# needed to run it.
#
# Three jobs on purpose. The publish job is gated behind `test`, so a commit that breaks the
# test suite can never ship an image. Building the tests into the image instead would not
# work either: .dockerignore deliberately excludes src/test/ so the image context stays
# small and deterministic.
#
# The third job exists because of a gap that only showed up while deploying: pulling the
# image does not get you Postgres, and pulling the compose file out of the repository means
# cloning a repository that is only source code to you. Attaching `docker-compose.prod.yml`
# and `env.example` to the release makes a fresh server's story `gh release download` —
# two files, no clone, the same token the box already needs for `docker login ghcr.io`.
#
# Publishing uses the workflow's own GITHUB_TOKEN rather than a personal token. It expires
# with the run, needs no secret to be stored anywhere, and — the part that actually matters
# here — GitHub connects the package to this repository on the first push from Actions. A
# push done with a PAT does not do that, which is why the image pushed locally earlier shows
# no "Connected repositories" until someone clicks it.

name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    # Without this, editing the README would trigger a full image build. If this file is
    # changed, it is listed below so workflow edits are still exercised.
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  # Manual runs ignore `paths`, which is what you want when testing the workflow itself.
  # `release_tag` is the other use: it re-attaches the compose files to a release that
  # already exists, so this job can be exercised without cutting a new tag, and so a file
  # that changes later can be backfilled onto the release it belongs to.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach docker-compose.prod.yml and env.example to (blank = skip)'
        required: false
        default: ''

# Least privilege the jobs actually need. contents:read is for checkout; packages:write is
# the only reason this can push to ghcr.io at all. Attaching a release asset needs
# contents:write, which is why release-asset declares its own `permissions:` block below —
# a job-level block replaces this one for that job rather than adding to it, so the job that
# uploads a file never also holds the right to push images.
permissions:
  contents: read
  packages: write

# A newer push to the same branch supersedes this run. Never do that for main — each push
# there publishes an image, and cancelling mid-push leaves a half-uploaded version behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # No test count in this name. A hardcoded number here has to be edited every time a test is
  # added, and the failure mode is a job silently advertising a count that stopped being true —
  # the same class of bug as the tag-derivation comment that documented tags nothing produced.
  # The count lives in the README, where it is read by humans who notice.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # Restores ~/.m2 from the cache keyed on pom.xml, so the suite does not re-download
          # Spring Boot on every commit. The suite runs on in-memory H2 (test scope) and
          # needs no services, which is exactly why it can stay this cheap.
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean verify

  build:
    name: build and push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are derived from the event:
      #   push to main   -> main, sha-<short>        (latest is NOT moved here)
      #   tag v1.2.3     -> 1.2.3, 1.2, v1.2.3, latest
      #   anything else  -> sha-<short>
      #
      # latest=auto below only emits `latest` for semver/pep440/schedule events, so an
      # ordinary commit to main cannot move it. Consumers pinned at :latest therefore get
      # the last tagged release rather than whatever happened to build an hour ago.
      #
      # This block is explicit on purpose. metadata-action's built-in defaults are only
      # type=ref (branch/tag/pr) plus latest=auto — omit `tags` entirely and a release
      # tag yields just `v1.2.3` and nothing records which commit an image came from.
      # The comment above used to promise tags the workflow never produced; v0.1.0 is
      # the release that exposed it.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only. Adding arm64 needs QEMU emulation, which roughly triples build time
          # and is not worth it until something actually runs these images on arm.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse and update the layer cache across runs, so an unchanged Dockerfile does
          # not re-run Maven's dependency download (~3 minutes) on every commit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Attaches the two files a deployed server actually needs. `docker pull` gets the app
  # image and nothing else — Postgres is a separate image with a separate release cadence,
  # which is why it is wrong to bundle it — so the app image alone has never been enough to
  # start a stack. Without this job the only way to get the compose file was to clone the
  # whole repository, source and all, onto a machine that will never build any of it.
  #
  # Gated on both jobs above: the asset is a promise that this file runs this release, and
  # attaching it after a publish that failed would be the same kind of stale claim as a tag
  # block documenting tags nothing produced.
  release-asset:
    name: attach compose files to release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag
        id: tag
        # Plain shell rather than an expression: a tag push carries the tag in the ref, a
        # manual run carries it in the input, and `refs/tags/` stripping is clearer to read
        # here than `startsWith(...) && github.ref_name || inputs.release_tag` would be.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${RELEASE_TAG_INPUT}" >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}

      - name: Attach files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The template cannot keep its name. GitHub rejects a release asset beginning with
          # a dot: uploading `.env.example` lands on the release as `default.env.example`,
          # and `gh release download -p .env.example` then matches nothing — and still exits
          # 0. A server following the README would have downloaded one file instead of two
          # and died later at `cp .env.example .env`, with nothing above it to explain why.
          # Confirmed on the raw API too: a second upload named `.env.example` is rejected
          # as already_exists, so this is GitHub's rule, not the CLI's.
          #
          # The release carries the template as `env.example` instead. Same bytes, same
          # purpose, one name that survives the round trip.
          cp .env.example env.example

          # The release is created by hand seconds after the tag goes up, while this job
          # runs minutes later behind two other jobs — so in practice it already exists and
          # the first attempt succeeds. The retries cover that ordering, not flakiness: if
          # every attempt fails, the tag was pushed with no release behind it, which is
          # worth a red run rather than a silent skip.
          for attempt in 1 2 3 4; do
            if gh release upload "$RELEASE_TAG" docker-compose.prod.yml env.example \
                 --clobber -R "$GITHUB_REPOSITORY"; then
              echo "attached docker-compose.prod.yml and env.example to $RELEASE_TAG"
              exit 0
            fi
            echo "attempt $attempt failed — release may not exist yet"
            sleep 15
          done
          echo "::error::could not attach files to release $RELEASE_TAG — does that release exist?"
          exit 1
