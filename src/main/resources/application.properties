spring.application.name=serverping

# --- HTTP ---------------------------------------------------------------------------
server.port=8080
# Loopback only: the API must not be reachable from the network until the SSRF guard
# and authentication story are settled. Set to 0.0.0.0 to expose it.
server.address=127.0.0.1

# --- Persistence --------------------------------------------------------------------
# Postgres. docker compose overrides all three from the `db` service; these defaults make
# ./mvnw spring-boot:run work against `docker compose up -d db` on the host.
# Driver is inferred from the URL, so no driver-class-name is needed.
spring.datasource.url=jdbc:postgresql://localhost:5432/serverping
spring.datasource.username=serverping
spring.datasource.password=serverping
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that what
# Flyway built still matches the entities. A mismatch then fails at startup instead of
# surfacing later as a broken query. Flyway itself needs no property — enabled by default
# whenever it is on the classpath.
spring.jpa.hibernate.ddl-auto=validate
# Lazy loading outside a transaction is a bug in this app, so don't hold the connection open.
spring.jpa.open-in-view=false

# --- Checker -------------------------------------------------------------------------
# Hard cap on a single TCP connect. Without it Java's default (tens of seconds) would let one
# dead host stall the /check endpoint and the background scheduler alike.
app.check-timeout-ms=2000

# --- Scheduler -----------------------------------------------------------------------
# Global cadence for background probing. fixedDelay counts from the END of a sweep, so with N
# targets each allowed app.check-timeout-ms a real cycle is interval + sweep duration.
app.check-interval=60000
# Let the application finish starting before the first sweep rather than racing Tomcat up.
app.check-initial-delay=5000
# Set to false to stop background probing entirely.
app.scheduler.enabled=true
