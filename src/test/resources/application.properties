# Test-only configuration. src/test/resources shadows src/main/resources on the test
# classpath, so tests run against an in-memory database and never touch ./data.

spring.application.name=serverping-test

spring.datasource.url=jdbc:h2:mem:serverping-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
